<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深圳分行合规知识模拟考试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f0f2f5; color: #333; line-height: 1.6;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }
  .header {
    background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%);
    color: white; padding: 24px 20px; border-radius: 12px;
    margin-bottom: 20px; text-align: center;
    box-shadow: 0 4px 12px rgba(26,54,93,0.2);
  }
  .header h1 { font-size: 22px; margin-bottom: 6px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.9; }
  .card {
    background: white; border-radius: 12px; padding: 20px;
    margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card-title {
    font-size: 16px; font-weight: 600; color: #1a365d;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 2px solid #e2e8f0;
  }
  .mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .mode-btn {
    background: white; border: 2px solid #e2e8f0; border-radius: 10px;
    padding: 20px 12px; text-align: center; cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn:hover {
    border-color: #2c5282; transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(44,82,130,0.12);
  }
  .mode-btn .icon { font-size: 32px; margin-bottom: 8px; }
  .mode-btn .label { font-size: 15px; font-weight: 600; color: #1a365d; }
  .mode-btn .desc { font-size: 12px; color: #718096; margin-top: 4px; }
  .stats-row { display: flex; justify-content: space-around; text-align: center; margin: 12px 0; }
  .stat-item .num { font-size: 24px; font-weight: 700; color: #2c5282; }
  .stat-item .label { font-size: 12px; color: #718096; }
  .btn {
    display: inline-block; padding: 10px 24px; border-radius: 8px;
    border: none; font-size: 15px; font-weight: 500; cursor: pointer;
    transition: all 0.2s; text-align: center;
  }
  .btn-primary { background: #2c5282; color: white; }
  .btn-primary:hover { background: #1a365d; }
  .btn-success { background: #38a169; color: white; }
  .btn-success:hover { background: #2f855a; }
  .btn-danger { background: #e53e3e; color: white; }
  .btn-danger:hover { background: #c53030; }
  .btn-secondary { background: #e2e8f0; color: #4a5568; }
  .btn-secondary:hover { background: #cbd5e0; }
  .btn-outline { background: white; color: #2c5282; border: 1.5px solid #2c5282; }
  .btn-outline:hover { background: #ebf8ff; }
  .btn-block { display: block; width: 100%; }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .question-card {
    background: white; border-radius: 12px; padding: 20px;
    margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .q-meta { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .q-tag {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 500;
  }
  .tag-type-single { background: #ebf8ff; color: #2b6cb0; }
  .tag-type-multi { background: #faf5ff; color: #6b46c1; }
  .tag-type-judge { background: #f0fff4; color: #276749; }
  .tag-score { background: #fffaf0; color: #c05621; }
  .q-text { font-size: 16px; font-weight: 500; color: #1a202c; margin-bottom: 16px; line-height: 1.7; }
  .option-list { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex; align-items: flex-start; padding: 12px 14px;
    border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer;
    transition: all 0.15s; background: white;
  }
  .option:hover { border-color: #90cdf4; background: #f7fafc; }
  .option.selected { border-color: #2c5282; background: #ebf8ff; }
  .option.correct { border-color: #38a169; background: #f0fff4; }
  .option.wrong { border-color: #e53e3e; background: #fff5f5; }
  .option-key {
    min-width: 28px; height: 28px; border-radius: 50%; background: #e2e8f0;
    color: #4a5568; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; margin-right: 10px; flex-shrink: 0;
  }
  .option.selected .option-key { background: #2c5282; color: white; }
  .option.correct .option-key { background: #38a169; color: white; }
  .option.wrong .option-key { background: #e53e3e; color: white; }
  .option-text { font-size: 15px; color: #2d3748; padding-top: 2px; }
  .progress-bar { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #2c5282, #3182ce); border-radius: 4px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #718096; text-align: center; margin-bottom: 12px; }
  .nav-btns { display: flex; gap: 10px; margin-top: 16px; }
  .nav-btns .btn { flex: 1; }
  .answer-sheet { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .sheet-item {
    width: 36px; height: 36px; border-radius: 8px; border: 2px solid #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
  }
  .sheet-item:hover { border-color: #90cdf4; }
  .sheet-item.answered { background: #ebf8ff; border-color: #2c5282; color: #2c5282; }
  .sheet-item.current { background: #2c5282; border-color: #2c5282; color: white; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin: 0 auto 16px; border: 4px solid #2c5282;
  }
  .score-circle .score-num { font-size: 36px; font-weight: 700; color: #2c5282; }
  .score-circle .score-label { font-size: 13px; color: #718096; }
  .score-pass { border-color: #38a169 !important; }
  .score-pass .score-num { color: #38a169 !important; }
  .score-fail { border-color: #e53e3e !important; }
  .score-fail .score-num { color: #e53e3e !important; }
  .result-detail { margin-top: 12px; padding: 14px; border-radius: 8px; background: #f7fafc; }
  .result-detail.correct { background: #f0fff4; border-left: 4px solid #38a169; }
  .result-detail.wrong { background: #fff5f5; border-left: 4px solid #e53e3e; }
  .result-detail .ans-line { margin-top: 6px; font-size: 14px; }
  .result-detail .ans-label { font-weight: 600; }
  .result-detail .ans-correct { color: #38a169; }
  .result-detail .ans-user { color: #e53e3e; }
  .hidden { display: none !important; }
  .empty-state { text-align: center; padding: 40px 20px; color: #a0aec0; }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .wrong-list-item {
    padding: 12px; border-radius: 8px; background: #fff5f5;
    border-left: 4px solid #e53e3e; margin-bottom: 10px;
  }
  .wrong-list-item .q-mini {
    font-size: 14px; color: #2d3748; margin-bottom: 6px;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .wrong-list-item .meta { font-size: 12px; color: #718096; }
  .action-bar { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #2d3748; color: white; padding: 10px 24px;
    border-radius: 8px; font-size: 14px; z-index: 1000; animation: fadeIn 0.3s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @media (max-width: 600px) {
    .mode-grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 18px; }
    .q-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="page-home">
    <div class="header">
      <h1>深圳分行&quot;知规明戒 严守底线&quot;</h1>
      <p>合规知识模拟考试系统</p>
    </div>
    <div class="card">
      <div class="card-title">&#128202; 题库统计</div>
      <div class="stats-row">
        <div class="stat-item"><div class="num">360</div><div class="label">总题数</div></div>
        <div class="stat-item"><div class="num">115</div><div class="label">单选题</div></div>
        <div class="stat-item"><div class="num">129</div><div class="label">多选题</div></div>
        <div class="stat-item"><div class="num">116</div><div class="label">判断题</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">&#127919; 选择练习模式</div>
      <div class="mode-grid">
        <div class="mode-btn" id="btn-exam">
          <div class="icon">&#128221;</div><div class="label">模拟考试</div>
          <div class="desc">42道题，真实考试体验</div>
        </div>
        <div class="mode-btn" id="btn-order">
          <div class="icon">&#128218;</div><div class="label">顺序练习</div>
          <div class="desc">按题库顺序逐题练习</div>
        </div>
        <div class="mode-btn" id="btn-random">
          <div class="icon">&#127922;</div><div class="label">随机练习</div>
          <div class="desc">打乱顺序随机抽题</div>
        </div>
        <div class="mode-btn" id="btn-wrong">
          <div class="icon">&#10060;</div><div class="label">错题重练</div>
          <div class="desc">从错题库中练习巩固</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">&#128203; 错题库</div>
      <div id="wrongbook-summary"><p style="color:#718096;font-size:14px;">加载中...</p></div>
      <div class="action-bar">
        <button class="btn btn-outline btn-sm" id="btn-show-wrong">查看全部错题</button>
        <button class="btn btn-danger btn-sm" id="btn-clear-wrong">清空错题库</button>
      </div>
    </div>
  </div>
  <div id="page-exam" class="hidden">
    <div class="header" style="padding:14px 20px;">
      <h1 id="exam-title">模拟考试</h1>
      <p id="exam-subtitle">第 1 / 42 题</p>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-text" id="progress-text">0 / 0</div>
    <div class="card" id="answer-sheet-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:14px;font-weight:600;color:#4a5568;">答题卡</span>
        <span style="font-size:12px;color:#718096;">点击题号跳转</span>
      </div>
      <div class="answer-sheet" id="answer-sheet"></div>
    </div>
    <div id="question-container"></div>
    <div class="nav-btns">
      <button class="btn btn-secondary" id="btn-prev">上一题</button>
      <button class="btn btn-primary" id="btn-next">下一题</button>
    </div>
    <div style="margin-top:16px;">
      <button class="btn btn-success btn-block" id="btn-submit">交卷</button>
    </div>
  </div>
  <div id="page-result" class="hidden">
    <div class="header"><h1>考试结果</h1><p id="result-subtitle"></p></div>
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="score-circle">
        <div class="score-num" id="score-num">0</div><div class="score-label">分</div>
      </div>
      <div id="result-message" style="font-size:16px;font-weight:600;margin-bottom:8px;"></div>
      <div id="result-stats" style="font-size:14px;color:#718096;"></div>
    </div>
    <div class="card">
      <div class="card-title">&#128202; 详细解析</div>
      <div id="result-details"></div>
    </div>
    <div class="action-bar">
      <button class="btn btn-primary" id="btn-home">返回首页</button>
      <button class="btn btn-outline" id="btn-restart">再做一次</button>
    </div>
  </div>
  <div id="page-wrongbook" class="hidden">
    <div class="header"><h1>我的错题库</h1><p>错题会自动保存，反复练习巩固</p></div>
    <div class="card">
      <div class="card-title">&#10060; 错题列表</div>
      <div id="wrongbook-list"></div>
    </div>
    <div class="action-bar">
      <button class="btn btn-primary" id="btn-wrong-practice">开始错题练习</button>
      <button class="btn btn-danger" id="btn-wrong-clear">清空错题库</button>
      <button class="btn btn-secondary" id="btn-wrong-home">返回首页</button>
    </div>
  </div>
</div>
<script>

// ===== Safari兼容存储层 =====
var _storageAvailable = false;
var _memoryStore = {};
try {
  var testKey = '__safari_test__';
  localStorage.setItem(testKey, '1');
  localStorage.removeItem(testKey);
  _storageAvailable = true;
} catch(e) {
  _storageAvailable = false;
}

function _lsSet(key, value) {
  if (_storageAvailable) {
    try { localStorage.setItem(key, value); } catch(e) {}
  } else {
    _memoryStore[key] = value;
  }
}
function _lsGet(key) {
  if (_storageAvailable) {
    try { return localStorage.getItem(key); } catch(e) { return null; }
  }
  return _memoryStore[key] || null;
}
function _lsRemove(key) {
  if (_storageAvailable) {
    try { localStorage.removeItem(key); } catch(e) {}
  } else {
    delete _memoryStore[key];
  }
}

var WB_KEY = 'compliance_wrongbook_v1';

function getWrongBook() {
  var raw = _lsGet(WB_KEY);
  if (!raw) return [];
  try { return JSON.parse(raw); } catch(e) { return []; }
}
function saveWrongBook(wb) {
  try { _lsSet(WB_KEY, JSON.stringify(wb)); } catch(e) {}
}
function addToWrongBook(question) {
  var wb = getWrongBook();
  var exists = false;
  for (var i = 0; i < wb.length; i++) {
    if (wb[i].id === question.id) { exists = true; break; }
  }
  if (!exists) { wb.push(question); saveWrongBook(wb); }
}
function removeFromWrongBook(qid) {
  var wb = getWrongBook();
  var filtered = [];
  for (var i = 0; i < wb.length; i++) {
    if (wb[i].id !== qid) filtered.push(wb[i]);
  }
  saveWrongBook(filtered);
  showWrongBook();
}
function clearWrongBook() {
  if (!confirm('确定要清空所有错题吗？此操作不可恢复。')) return;
  _lsRemove(WB_KEY);
  showToast('错题库已清空');
  updateWrongBookSummary();
  var pwb = document.getElementById('page-wrongbook');
  if (pwb && pwb.className.indexOf('hidden') === -1) showWrongBook();
}

var currentMode = '';
var currentQuestions = [];
var currentIndex = 0;
var userAnswers = {};
var examStartTime = null;

function showPage(pid) {
  var pages = ['page-home', 'page-exam', 'page-result', 'page-wrongbook'];
  for (var i = 0; i < pages.length; i++) {
    document.getElementById(pages[i]).classList.add('hidden');
  }
  document.getElementById(pid).classList.remove('hidden');
  window.scrollTo(0, 0);
}
function goHome() { showPage('page-home'); updateWrongBookSummary(); }

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function escapeHtml(text) {
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2000);
}

// ===== 模式启动 =====
function startExam() {
  currentMode = 'exam'; examStartTime = Date.now();
  var singles = [], multis = [], judges = [];
  for (var i = 0; i < ALL_QUESTIONS.length; i++) {
    var q = ALL_QUESTIONS[i];
    if (q.type === '单选') singles.push(q);
    else if (q.type === '多选') multis.push(q);
    else if (q.type === '判断') judges.push(q);
  }
  var picked = [];
  var ss = shuffleArray(singles), sm = shuffleArray(multis), sj = shuffleArray(judges);
  for (var i = 0; i < Math.min(25, ss.length); i++) picked.push(ss[i]);
  for (var i = 0; i < Math.min(6, sm.length); i++) picked.push(sm[i]);
  for (var i = 0; i < Math.min(10, sj.length); i++) picked.push(sj[i]);
  currentQuestions = shuffleArray(picked);
  currentIndex = 0; userAnswers = {};
  document.getElementById('exam-title').textContent = '模拟考试';
  showPage('page-exam'); renderQuestion(); renderAnswerSheet();
}
function startPractice(mode) {
  currentMode = mode; examStartTime = Date.now();
  var qs = ALL_QUESTIONS.slice();
  if (mode === 'random') qs = shuffleArray(qs);
  currentQuestions = qs; currentIndex = 0; userAnswers = {};
  document.getElementById('exam-title').textContent = mode === 'order' ? '顺序练习' : '随机练习';
  showPage('page-exam'); renderQuestion(); renderAnswerSheet();
}
function startWrongPractice() {
  var wb = getWrongBook();
  if (wb.length === 0) { showToast('错题库为空，先去做题吧！'); return; }
  currentMode = 'wrong'; examStartTime = Date.now();
  var wbIds = {};
  for (var i = 0; i < wb.length; i++) wbIds[wb[i].id] = true;
  var filtered = [];
  for (var i = 0; i < ALL_QUESTIONS.length; i++) {
    if (wbIds[ALL_QUESTIONS[i].id]) filtered.push(ALL_QUESTIONS[i]);
  }
  currentQuestions = shuffleArray(filtered);
  currentIndex = 0; userAnswers = {};
  document.getElementById('exam-title').textContent = '错题重练';
  showPage('page-exam'); renderQuestion(); renderAnswerSheet();
}

// ===== 渲染题目 =====
function renderQuestion() {
  var q = currentQuestions[currentIndex];
  var total = currentQuestions.length;
  document.getElementById('exam-subtitle').textContent = '第 ' + (currentIndex + 1) + ' / ' + total + ' 题';
  document.getElementById('progress-fill').style.width = ((currentIndex + 1) / total * 100) + '%';
  document.getElementById('progress-text').textContent = (currentIndex + 1) + ' / ' + total;

  var typeClass = 'tag-type-single', typeText = '单选题';
  if (q.type === '多选') { typeClass = 'tag-type-multi'; typeText = '多选题'; }
  else if (q.type === '判断') { typeClass = 'tag-type-judge'; typeText = '判断题'; }

  var optionsHtml = '';
  var userAns = userAnswers[q.id] || '';

  if (q.type === '判断') {
    var opts = [{label:'A',text:'正确'},{label:'B',text:'错误'}];
    for (var i = 0; i < opts.length; i++) {
      var opt = opts[i];
      var sel = userAns === opt.label ? 'selected' : '';
      optionsHtml += '<div class="option ' + sel + '" data-opt="' + opt.label + '">' +
        '<div class="option-key">' + opt.label + '</div>' +
        '<div class="option-text">' + escapeHtml(opt.text) + '</div></div>';
    }
  } else {
    for (var i = 0; i < q.options.length; i++) {
      var opt = q.options[i];
      var sel = '';
      if (q.type === '多选') sel = userAns.indexOf(opt.label) > -1 ? 'selected' : '';
      else sel = userAns === opt.label ? 'selected' : '';
      optionsHtml += '<div class="option ' + sel + '" data-opt="' + opt.label + '">' +
        '<div class="option-key">' + opt.label + '</div>' +
        '<div class="option-text">' + escapeHtml(opt.text) + '</div></div>';
    }
  }

  var sourceHtml = '';
  if (q.source) sourceHtml = '<div style="font-size:12px;color:#a0aec0;margin-bottom:8px;">&#128214; ' + escapeHtml(q.source) + '</div>';

  document.getElementById('question-container').innerHTML =
    '<div class="question-card">' +
      '<div class="q-meta">' +
        '<span class="q-tag ' + typeClass + '">' + typeText + '</span>' +
        '<span class="q-tag tag-score">' + q.score + '分</span>' +
      '</div>' + sourceHtml +
      '<div class="q-text">' + escapeHtml(q.question) + '</div>' +
      '<div class="option-list" id="opt-list">' + optionsHtml + '</div>' +
    '</div>';

  var optList = document.getElementById('opt-list');
  if (optList) {
    optList.addEventListener('click', function(e) {
      var target = e.target;
      while (target && target !== optList && target.className.indexOf('option') === -1) {
        target = target.parentElement;
      }
      if (target && target.className.indexOf('option') > -1) {
        var lbl = target.getAttribute('data-opt');
        if (lbl) selectAnswer(lbl);
      }
    });
  }

  document.getElementById('btn-prev').disabled = currentIndex === 0;
  document.getElementById('btn-next').textContent = currentIndex === total - 1 ? '最后一题' : '下一题';
  updateAnswerSheetHighlight();
}

function selectAnswer(label) {
  var q = currentQuestions[currentIndex];
  if (q.type === '多选') {
    var cur = userAnswers[q.id] || '';
    var arr = [];
    for (var i = 0; i < cur.length; i++) { if (cur[i]) arr.push(cur[i]); }
    var idx = -1;
    for (var i = 0; i < arr.length; i++) { if (arr[i] === label) { idx = i; break; } }
    if (idx > -1) arr.splice(idx, 1);
    else { arr.push(label); arr.sort(); }
    userAnswers[q.id] = arr.join('');
  } else {
    userAnswers[q.id] = label;
  }
  renderQuestion(); updateAnswerSheet();
}

function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function nextQuestion() { if (currentIndex < currentQuestions.length - 1) { currentIndex++; renderQuestion(); } }
function goToQuestion(idx) { currentIndex = idx; renderQuestion(); }

// ===== 答题卡 =====
function renderAnswerSheet() {
  var html = '';
  for (var i = 0; i < currentQuestions.length; i++) {
    var q = currentQuestions[i];
    var answered = userAnswers[q.id] ? 'answered' : '';
    html += '<div class="sheet-item ' + answered + '" id="sheet-' + i + '">' + (i + 1) + '</div>';
  }
  document.getElementById('answer-sheet').innerHTML = html;
  for (var i = 0; i < currentQuestions.length; i++) {
    (function(idx) {
      var el = document.getElementById('sheet-' + idx);
      if (el) el.onclick = function() { goToQuestion(idx); };
    })(i);
  }
}
function updateAnswerSheet() {
  for (var i = 0; i < currentQuestions.length; i++) {
    var el = document.getElementById('sheet-' + i);
    if (el) {
      if (userAnswers[currentQuestions[i].id]) el.classList.add('answered');
      else el.classList.remove('answered');
    }
  }
}
function updateAnswerSheetHighlight() {
  for (var i = 0; i < currentQuestions.length; i++) {
    var el = document.getElementById('sheet-' + i);
    if (el) {
      if (i === currentIndex) el.classList.add('current');
      else el.classList.remove('current');
    }
  }
}

// ===== 交卷 =====
function submitExam() {
  var answered = 0;
  for (var k in userAnswers) { if (userAnswers.hasOwnProperty(k)) answered++; }
  var total = currentQuestions.length;
  if (answered < total) {
    if (!confirm('还有 ' + (total - answered) + ' 道题未作答，确定要交卷吗？')) return;
  } else {
    if (!confirm('确定要交卷吗？')) return;
  }
  showResult();
}

// ===== 结果 =====
function showResult() {
  var totalScore = 0, correctCount = 0, wrongCount = 0;
  var detailsHtml = '';

  for (var idx = 0; idx < currentQuestions.length; idx++) {
    var q = currentQuestions[idx];
    var userAns = (userAnswers[q.id] || '').toUpperCase();
    var correctAns = q.answer.toUpperCase();
    var isCorrect = userAns === correctAns;
    if (isCorrect) { totalScore += q.score; correctCount++; }
    else { wrongCount++; addToWrongBook(q); }

    var statusClass = isCorrect ? 'correct' : 'wrong';
    var statusText = isCorrect ? '回答正确' : '回答错误';
    var userAnsText = userAns || '未作答';

    var optionsReview = '';
    if (q.type === '判断') {
      optionsReview = '<div style="margin-top:6px;font-size:13px;color:#4a5568;">A. 正确 &nbsp; B. 错误</div>';
    } else {
      var optParts = [];
      for (var oi = 0; oi < q.options.length; oi++) {
        optParts.push(q.options[oi].label + '. ' + q.options[oi].text);
      }
      optionsReview = '<div style="margin-top:6px;font-size:13px;color:#4a5568;">' + optParts.join(' &nbsp; ') + '</div>';
    }

    detailsHtml +=
      '<div class="result-detail ' + statusClass + '" style="margin-bottom:10px;">' +
        '<div style="font-weight:600;margin-bottom:4px;">' + (idx + 1) + '. [' + q.type + '] ' + escapeHtml(q.question) + '</div>' +
        optionsReview +
        '<div class="ans-line">' +
          '<span class="ans-label">你的答案：</span><span class="ans-user">' + userAnsText + '</span>' +
          '&nbsp;&nbsp;<span class="ans-label">正确答案：</span><span class="ans-correct">' + correctAns + '</span>' +
          '&nbsp;&nbsp;<span style="font-size:13px;color:#718096;">' + statusText + ' (' + (isCorrect ? '+' + q.score : '0') + '分)</span>' +
        '</div>' +
      '</div>';
  }

  var maxScore = 0;
  for (var i = 0; i < currentQuestions.length; i++) maxScore += currentQuestions[i].score;
  var passLine = currentMode === 'exam' ? 60 : 0;
  var passed = totalScore >= passLine;

  var circle = document.getElementById('score-circle');
  circle.className = 'score-circle' + (currentMode === 'exam' ? (passed ? ' score-pass' : ' score-fail') : '');
  document.getElementById('score-num').textContent = totalScore;
  document.getElementById('result-subtitle').textContent = currentMode === 'exam' ? '模拟考试结果' : '练习结果';

  var msg = document.getElementById('result-message');
  if (currentMode === 'exam') {
    msg.textContent = passed ? '恭喜，考试通过！' : '未通过，继续加油！';
    msg.style.color = passed ? '#38a169' : '#e53e3e';
  } else {
    msg.textContent = '共 ' + currentQuestions.length + ' 题，答对 ' + correctCount + ' 题';
    msg.style.color = '#2c5282';
  }
  document.getElementById('result-stats').innerHTML =
    '总分: ' + totalScore + ' / ' + maxScore + ' &nbsp;|&nbsp; 正确: ' + correctCount +
    ' &nbsp;|&nbsp; 错误: ' + wrongCount + ' &nbsp;|&nbsp; 未答: ' + (currentQuestions.length - correctCount - wrongCount);
  document.getElementById('result-details').innerHTML = detailsHtml;
  showPage('page-result');
}

function restartSame() {
  currentIndex = 0; userAnswers = {};
  examStartTime = Date.now();
  showPage('page-exam'); renderQuestion(); renderAnswerSheet();
}

// ===== 错题库 =====
function showWrongBook() {
  var wb = getWrongBook();
  var list = document.getElementById('wrongbook-list');
  if (wb.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">&#128236;</div><div>错题库为空</div><div style="font-size:13px;margin-top:4px;">做题后，答错的题目会自动收录到这里</div></div>';
  } else {
    var html = '';
    for (var i = 0; i < wb.length; i++) {
      var q = wb[i];
      html += '<div class="wrong-list-item">' +
        '<div class="q-mini">' + q.id + '. [' + q.type + '] ' + escapeHtml(q.question) + '</div>' +
        '<div class="meta">正确答案: ' + q.answer + ' &nbsp;|&nbsp; ' + q.score + '分 &nbsp;|&nbsp; ' + (q.source || '无') + '</div>' +
        '<div style="margin-top:8px;"><button class="btn btn-danger btn-sm" onclick="removeFromWrongBook(' + q.id + ')">移除</button></div>' +
      '</div>';
    }
    list.innerHTML = html;
  }
  showPage('page-wrongbook');
}

function updateWrongBookSummary() {
  var wb = getWrongBook();
  var el = document.getElementById('wrongbook-summary');
  if (wb.length === 0) {
    el.innerHTML = '<p style="color:#a0aec0;font-size:14px;">暂无错题，快去练习吧！</p>';
  } else {
    el.innerHTML = '<div style="display:flex;gap:16px;align-items:center;">' +
      '<div style="font-size:28px;font-weight:700;color:#e53e3e;">' + wb.length + '</div>' +
      '<div style="font-size:14px;color:#4a5568;">道错题待复习<br><span style="font-size:12px;color:#718096;">点击"错题重练"开始巩固</span></div>' +
    '</div>';
  }
}

// ===== 事件绑定：不用HTML内联onclick，全部用addEventListener =====
function bindEvents() {
  document.getElementById('btn-exam').addEventListener('click', startExam);
  document.getElementById('btn-order').addEventListener('click', function() { startPractice('order'); });
  document.getElementById('btn-random').addEventListener('click', function() { startPractice('random'); });
  document.getElementById('btn-wrong').addEventListener('click', startWrongPractice);
  document.getElementById('btn-show-wrong').addEventListener('click', showWrongBook);
  document.getElementById('btn-clear-wrong').addEventListener('click', clearWrongBook);
  document.getElementById('btn-prev').addEventListener('click', prevQuestion);
  document.getElementById('btn-next').addEventListener('click', nextQuestion);
  document.getElementById('btn-submit').addEventListener('click', submitExam);
  document.getElementById('btn-home').addEventListener('click', goHome);
  document.getElementById('btn-restart').addEventListener('click', restartSame);
  document.getElementById('btn-wrong-practice').addEventListener('click', startWrongPractice);
  document.getElementById('btn-wrong-clear').addEventListener('click', clearWrongBook);
  document.getElementById('btn-wrong-home').addEventListener('click', goHome);
}

// 键盘支持
document.addEventListener('keydown', function(e) {
  var examPage = document.getElementById('page-exam');
  if (!examPage || examPage.className.indexOf('hidden') > -1) return;
  if (e.key === 'ArrowLeft') prevQuestion();
  if (e.key === 'ArrowRight') nextQuestion();
  var keyMap = {'1':'A','2':'B','3':'C','4':'D','5':'E','6':'F'};
  if (keyMap[e.key]) selectAnswer(keyMap[e.key]);
});

// 初始化
bindEvents();
updateWrongBookSummary();
</script>
